name: Build, scrape, and publish NRR

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Endurance Promotions
        run: node --max-old-space-size=6144 scraper.cjs --sport nordic --start-id 1668 --max-id 3000 --out public/results.json --batch-size 20

      - name: Verify scraper output
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('public/results.json', 'utf8'));
          const matches = Array.isArray(data.matches) ? data.matches : [];
          if (!matches.length) throw new Error('Scraper produced no matches.');
          const missingSeason = matches.filter(r => !r.season).length;
          if (missingSeason) throw new Error(`Found ${missingSeason} result rows without a season.`);
          const seasons = [...new Set(matches.map(r => r.season))].sort();
          console.log(`Verified ${matches.length} result rows across seasons: ${seasons.join(', ')}`);
          if (!seasons.includes('2024-2025')) throw new Error('2024-2025 season was not found in scraper output.');
          NODE

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/results.json
          if git diff --cached --quiet; then
            echo "No results changes to commit."
          else
            git commit -m "Update Nordic results [skip ci]"
            git push
          fi

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
